  <style>
    :root{color-scheme:light;--ink:#252525;--muted:#666;--paper:#fff;--line:#e7e2d9;--accent:#9b3429;--bg:#f7f5f0}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(900px,calc(100% - 32px));margin:42px auto;background:var(--paper);padding:clamp(22px,5vw,58px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 35px #322b1c0c;overflow-wrap:anywhere}
    h1{font-size:clamp(29px,5vw,44px);line-height:1.35;letter-spacing:-.03em}h2{font-size:25px;line-height:1.5;margin:2.2em 0 .7em;padding-top:.7em;border-top:1px solid var(--line);scroll-margin-top:16px}h3{font-size:19px;line-height:1.6;margin:1.5em 0 .45em}p{margin:.75em 0}a{color:var(--accent);text-underline-offset:3px}blockquote{margin:1em 0;padding:12px 18px;border-left:3px solid #d5a840;background:#fff8e8;color:#444}hr{border:0;border-top:1px solid var(--line);margin:2em 0}img{max-width:100%;height:auto}table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}pre{max-width:100%;overflow:auto}ul,ol{padding-left:1.7em}li{padding-left:.15em}

  </style>
</head>
<body>
<main>
  {% capture readme_markdown %}{% include_relative README.md %}{% endcapture %}
  {{ readme_markdown | markdownify }}
</main>
<script>
  (()=>{
    const main=document.querySelector('main');
    const marker='2026的国奖评审中，发表于';
    // The eleventh section was plain text rather than a Markdown heading. Split its
    // existing paragraph at the next paragraph's opening words, preserving all text.
    const candidate=[...main.querySelectorAll('p')].find(p=>p.textContent.trim().startsWith('十一、如果你和学院关系好'));
    if(candidate){
      const original=candidate.textContent.trim();
      const splitAt=original.indexOf(marker);
      if(splitAt>0){
        const heading=document.createElement('h2');
        heading.textContent=original.slice(0,splitAt).trim();
        const following=document.createElement('p');
        following.textContent=original.slice(splitAt).trim();
        candidate.replaceWith(heading,following);
      }else{
        const heading=document.createElement('h2');
        heading.textContent=original;
        candidate.replaceWith(heading);
      }
    }
    // Generate the displayed contents list from section headings, so it always
    // contains all eleven sections and its links point to the rendered headings.
    const tocHeading=[...main.querySelectorAll('h2')].find(h=>h.textContent.trim()==='目录');
    const tocList=tocHeading?.nextElementSibling;
    if(tocList && (tocList.tagName==='UL'||tocList.tagName==='OL')){
      const sections=[...main.querySelectorAll('h2')].filter(h=>h!==tocHeading);
      sections.forEach((heading,index)=>{
        heading.id='section-'+(index+1);
        heading.setAttribute('tabindex','-1');
      });
      tocList.replaceChildren(...sections.map((heading,index)=>{
        const li=document.createElement('li');
        const link=document.createElement('a');
        link.href='#section-'+(index+1);
        link.textContent=heading.textContent;
        li.append(link);
        return li;
      }));
    }
  })();
</script>
</body>
